# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "congo"
defaultAppearance = "dark"   # valid options: light or dark
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = true

replyByEmail = false

# mainSections = ["section1", "section2"]
# robots = ""

disableImageOptimization = false
disableTextInHeader = false
# backgroundImageWidth = 1200

defaultBackgroundImage = "background.webp" # used as default for background images
# defaultFeaturedImage = "background.webp" # used as default for featured images in all articles

highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = true

giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v8.next.forgejo.org"

[header]
layout = "fixed" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
showMenu = true
showCopyright = true
showThemeAttribution = true
showAppearanceSwitcher = true
showScrollToTop = true

[homepage]
layout = "background"         # valid options: page, profile, hero, card, background, custom
homepageImage = "星星坠落的傍晚.jpg" # used in: hero, and card
showRecent = true
showRecentItems = 10
showMoreLink = true
showMoreLinkDest = "/posts/"
cardView = false
cardViewScreenWidth = false
layoutBackgroundBlur = true   # only used when layout equals background

[article]
showDate = true
showViews = false
showLikes = false
showDateOnlyInArticle = false
showDateUpdated = false
showAuthor = true
showAuthorBottom = true
showHero = true
heroStyle = "background"           # valid options: basic, big, background, thumbAndBackground
layoutBackgroundBlur = true        # only used when heroStyle equals background or thumbAndBackground
layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
showBreadcrumbs = false
showDraftLabel = true
showEdit = false
# editURL = "https://github.com/username/repo/"
editAppendPath = true
seriesOpened = false
showHeadingAnchors = true
showPagination = true
invertPagination = false
showReadingTime = true
showTableOfContents = true
# showRelatedContent = false
# relatedContentLimit = 3
showTaxonomies = true
showAuthorsBadges = false
showWordCount = true
showComments = true
# sharingLinks = [ "twitter", "bluesky", "mastodon", "reddit", "facebook", "email", "whatsapp", "telegram"]
showZenMode = false

# 无 TOC/相关文章侧栏时，正文列的最大宽度（覆盖主题默认的 65ch）。
# 在高分辨率屏上向右拓展，吃掉侧栏本应占用的空间。可用任意 CSS 长度，如 "80ch"/"72ch"/"55rem"。
maxContentWidth = "80ch"

# 带 TOC/相关文章侧栏时，正文列的最大宽度（主题默认 65ch）。
# 向右拓展一点，同时缩小正文与侧栏的间距。侧栏仍靠右对齐，位置不变。
maxContentWidthWithToc = "75ch"

[atom]
# Atom 订阅页（/atom.xml）的展示设置

# 悬停高亮防抖延迟（毫秒）：鼠标在卡片上停留多久后点亮高亮。
# 值越大越"沉稳"（快速划过不闪烁），值越小越跟手。
debounceMs = 70

# 强调色，"R, G, B" 格式（如 "139, 92, 246"）。
# 留空则自动跟随主题 colorScheme 当前配色的 primary 色，换配色无需手动同步。
# accentColor = "139, 92, 246"

[list]
showHero = true
heroStyle = "background"           # valid options: basic, big, background, thumbAndBackground
layoutBackgroundBlur = true        # only used when heroStyle equals background or thumbAndBackground
layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
showBreadcrumbs = false
showSummary = true
showViews = false
showLikes = false
showTableOfContents = false
showCards = false
orderByWeight = false
groupByYear = true
cardView = false
cardViewScreenWidth = false
constrainItemsWidth = false

[sitemap]
excludedKinds = ["taxonomy", "term"]

[taxonomy]
showTermCount = true
showHero = true
heroStyle = "background"    # valid options: basic, big, background, thumbAndBackground
showBreadcrumbs = false
showViews = false
showLikes = false
showTableOfContents = false
cardView = false

[term]
showHero = true
heroStyle = "background"    # valid options: basic, big, background, thumbAndBackground
showBreadcrumbs = false
showViews = false
showLikes = false
showTableOfContents = true
groupByYear = false
cardView = false
cardViewScreenWidth = false

