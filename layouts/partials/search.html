<div
  id="search-wrapper"
  class="invisible fixed inset-0 flex h-screen w-screen cursor-default flex-col bg-neutral-500/50 p-4 backdrop-blur-sm dark:bg-neutral-900/50 sm:p-6 md:p-[10vh] lg:p-[12vh] z-500"
  data-url="{{ "" | absLangURL }}">
  <div
    id="search-modal"
    class="flex flex-col w-full max-w-3xl min-h-0 mx-auto border rounded-md shadow-lg top-20 border-neutral-200 bg-neutral dark:border-neutral-700 dark:bg-neutral-800">
    <header class="relative z-10 flex items-center justify-between flex-none px-2">
      <form class="flex items-center flex-auto min-w-0">
        <div class="flex items-center justify-center w-8 h-8 text-neutral-400">
          {{ partial "icon.html" "search" }}
        </div>
        <input
          type="search"
          id="search-query"
          class="search-input flex flex-auto h-12 mx-1 bg-transparent border-0 appearance-none focus:outline-dotted focus:outline-2 focus:outline-transparent"
          placeholder="{{ i18n "search.input_placeholder" }}"
          tabindex="0">
      </form>
      <button
        id="close-search-button"
        class="flex items-center justify-center w-8 h-8 text-neutral-700 hover:text-primary-600 dark:text-neutral dark:hover:text-primary-400"
        title="{{ i18n "search.close_button_title" }}">
        {{ partial "icon.html" "xmark" }}
      </button>
    </header>
    <section class="flex-auto px-2 overflow-auto">
      <ul id="search-results">
      </ul>
    </section>
  </div>
</div>

<style>
  /* 覆盖 Tailwind v4 Preflight 给所有 input 强加的蓝色边框与聚焦环，
     改为跟随主题 primary（congo 紫）。
     preflight 用 box-shadow 模拟 ring、outline 为透明，故需同步覆盖
     ring 颜色/宽度与 outline，不能简单 box-shadow:none。 */
  .search-input {
    border: 0 !important;
    background-color: transparent !important;
  }
  .search-input:focus {
    outline: none !important;
    border: 1px solid rgba(var(--color-primary-500), 1) !important;
    border-radius: 0.25rem !important;
    box-shadow: inset 0 0 0 1px rgba(var(--color-primary-500), 1) !important;
  }
  /* search.js 动态拼接搜索结果项，Tailwind 扫描不到 JS 无法按需编译，
     在此显式声明，保证暗色模式下的背景与聚焦高亮生效。
     深色模式高亮用 primary-800 取代主题默认的 primary-900，太深看不出。 */
  .bg-neutral-700 { background-color: rgba(var(--color-neutral-700), 1); }
  .bg-primary-900 { background-color: rgba(var(--color-primary-800), 1); }
  html.dark .bg-primary-900,
  html.dark .focus\:bg-primary-900:focus,
  html.dark .hover\:bg-primary-900:hover {
    background-color: rgba(var(--color-primary-800), 1) !important;
  }
</style>
