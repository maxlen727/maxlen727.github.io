{{ define "main" }}
  {{ .Scratch.Set "scope" "single" }}
  <article>
    <header class="mt-5 max-w-prose">
      <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
        {{ .Title | emojify }}
      </h1>
      <div class="mt-2 mb-6 text-base text-neutral-500 dark:text-neutral-400">
        {{ .Content }}
      </div>
    </header>

    {{ with .Site.Data.friends }}
      <section class="friend-grid">
        {{ range .friends }}
          <a
            class="friend-card"
            href="{{ .url }}"
            target="_blank"
            rel="noopener noreferrer">
            <div class="friend-avatar">
              <img src="{{ .avatar }}" alt="{{ .title }}" loading="lazy" decoding="async" />
              <img
                class="friend-favicon"
                src="https://icons.duckduckgo.com/ip3/{{ (urls.Parse .url).Host }}.ico"
                alt=""
                loading="lazy"
                decoding="async"
                onerror="this.remove()" />
            </div>
            <div class="friend-info">
              <span class="friend-name">{{ .title }}</span>
              <span class="friend-desc">{{ .description }}</span>
            </div>
          </a>
        {{ end }}
      </section>
    {{ end }}
  </article>

  <style>
    .friend-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      margin-top: 1.5rem;
    }
    .friend-card {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(var(--color-neutral-200), 1);
      border-radius: 0.75rem;
      background: rgba(var(--color-neutral-100), 1);
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    html.dark .friend-card {
      border-color: rgba(var(--color-neutral-700), 1);
      background: rgba(var(--color-neutral-900), 1);
    }
    .friend-card:hover {
      border-color: rgba(var(--color-primary-500), 1);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }
    html.dark .friend-card:hover {
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    }
    .friend-avatar {
      position: relative;
      flex: none;
      width: 3.25rem;
      height: 3.25rem;
    }
    .friend-avatar > img {
      width: 100%;
      height: 100%;
      border-radius: 0.6rem;
      object-fit: cover;
      background: rgba(var(--color-neutral-200), 1);
    }
    html.dark .friend-avatar > img {
      background: rgba(var(--color-neutral-800), 1);
    }
    .friend-favicon {
      position: absolute;
      right: -0.3rem;
      bottom: -0.3rem;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 0.3rem;
      border: 2px solid rgba(var(--color-neutral-100), 1);
      background: #fff;
    }
    html.dark .friend-favicon {
      border-color: rgba(var(--color-neutral-900), 1);
      background: rgba(var(--color-neutral-800), 1);
    }
    .friend-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .friend-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: rgba(var(--color-neutral-900), 1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html.dark .friend-name {
      color: rgba(var(--color-neutral), 1);
    }
    .friend-desc {
      margin-top: 0.15rem;
      font-size: 0.8rem;
      line-height: 1.4;
      color: rgba(var(--color-neutral-500), 1);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    html.dark .friend-desc {
      color: rgba(var(--color-neutral-400), 1);
    }
  </style>
{{ end }}
